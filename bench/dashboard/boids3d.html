<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>boids3d 阶梯压测 — LayaAir vs Cocos</title>
<style>
  body{font:14px/1.6 "Microsoft YaHei",sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
  h1{font-size:18px;margin:0 0 8px}
  .row{margin:8px 0}
  a{color:#8ecdf7}
  button{background:#2d2d2d;color:#ddd;border:1px solid #555;border-radius:4px;padding:4px 12px;cursor:pointer}
  button.on{background:#1d3a2a;border-color:#8ecdf7;color:#8ecdf7}
  #wrap{width:1280px;height:720px;border:1px solid #444;margin-top:10px}
  #frame{width:1280px;height:720px;border:0;display:block}
  .note{color:#888;font-size:12px}
  input{background:#2d2d2d;color:#ddd;border:1px solid #555;border-radius:4px;padding:3px 6px;width:330px}
</style>
</head>
<body>
<h1>3D 水族馆 boids3d — 阶梯压测壳页（固定 1280×720 渲染分辨率）</h1>
<div class="row">
  引擎：
  <button id="btn-laya">LayaAir</button>
  <button id="btn-cocos">Cocos</button>
  &nbsp;模式：
  <button id="btn-ramp">ramp（阶梯 50→50000）</button>
  <button id="btn-fixed">fixed</button>
  <input id="count" value="50" title="fixed 模式鱼数" style="width:80px">
</div>
<div class="row">
  <span class="note">Laya 预览地址</span> <input id="layaUrl">
  <span class="note">Cocos 预览地址</span> <input id="cocosUrl">
</div>
<div class="row">
  <button id="btn-run">▶ 加载 / 重跑</button>
  <a id="open" target="_blank">新窗口打开</a>
  <span class="note">（需先启动各引擎预览；iframe 固定 1280×720×DPR，保证双端 fillrate 一致）</span>
</div>
<div id="wrap"><iframe id="frame"></iframe></div>
<p class="note">跑完后点引擎页面里的「复制」按钮导出 JSON，拖进 <a href="index.html" target="_blank">dashboard</a> 对比。</p>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var state = {
    engine: q.get('engine') || 'laya',
    mode: q.get('mode') || 'ramp',
    count: q.get('count') || '50',
    layaUrl: q.get('layaUrl') || 'http://localhost:8989/',
    cocosUrl: q.get('cocosUrl') || 'http://localhost:7456/'
  };
  var $ = function (id) { return document.getElementById(id); };
  $('layaUrl').value = state.layaUrl;
  $('cocosUrl').value = state.cocosUrl;
  $('count').value = state.count;

  function buildUrl() {
    state.layaUrl = $('layaUrl').value.replace(/\/?$/, '/');
    state.cocosUrl = $('cocosUrl').value.replace(/\/?$/, '/');
    state.count = $('count').value || '50';
    var base = state.engine === 'laya' ? state.layaUrl : state.cocosUrl;
    var qs = '?auto=1&mode=' + state.mode;
    if (state.mode === 'fixed') qs += '&count=' + encodeURIComponent(state.count);
    return base + qs;
  }
  function refresh() {
    ['laya', 'cocos'].forEach(function (e) { $('btn-' + e).className = state.engine === e ? 'on' : ''; });
    ['ramp', 'fixed'].forEach(function (m) { $('btn-' + m).className = state.mode === m ? 'on' : ''; });
    var url = buildUrl();
    $('frame').src = url;
    $('open').href = url;
    var p = new URLSearchParams();
    p.set('engine', state.engine); p.set('mode', state.mode); p.set('count', state.count);
    p.set('layaUrl', state.layaUrl); p.set('cocosUrl', state.cocosUrl);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }
  $('btn-laya').onclick = function () { state.engine = 'laya'; refresh(); };
  $('btn-cocos').onclick = function () { state.engine = 'cocos'; refresh(); };
  $('btn-ramp').onclick = function () { state.mode = 'ramp'; refresh(); };
  $('btn-fixed').onclick = function () { state.mode = 'fixed'; refresh(); };
  $('btn-run').onclick = refresh;
  refresh();
})();
</script>
</body>
</html>
